name: Daily auto commit

on:
  schedule:
    - cron: '17 2 * * *' # 09:17 Asia/Jakarta (WIB)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-auto-commit
  cancel-in-progress: false

jobs:
  auto_commit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out default branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - name: Update daily activity
        shell: bash
        run: |
          set -euo pipefail
          today=$(TZ=Asia/Jakarta date '+%Y-%m-%d')
          if [ -f LAST_UPDATED ] && [ "$(cat LAST_UPDATED)" = "$today" ]; then
            echo "Already updated today."
            exit 0
          fi
          printf '%s\n' "$today" > LAST_UPDATED
          git config user.name "Triyan Arif Wibowo"
          git config user.email "23157489+triyanarief@users.noreply.github.com"
          git add LAST_UPDATED
          git commit -m "chore(bot): daily update $today"
          git push origin HEAD:main
